  <!-- Scramble / decrypt sequence -->
  <g text-anchor="middle"
     font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"
     font-size="43"
     font-weight="750"
     fill="#F0F6FC">

    <text x="500" y="110" opacity="0">H6P JGV?7U
      <animate attributeName="opacity"
        values="1;1;0;0;0;0;0"
        keyTimes="0;0.08;0.10;0.42;0.70;0.92;1"
        dur="8s" repeatCount="indefinite"/>
    </text>

    <text x="500" y="110" opacity="0">H!, I'? N6UY?N H0ÀN6 N#ÂN
      <animate attributeName="opacity"
        values="0;0;1;1;0;0;0"
        keyTimes="0;0.09;0.10;0.18;0.20;0.92;1"
        dur="8s" repeatCount="indefinite"/>
