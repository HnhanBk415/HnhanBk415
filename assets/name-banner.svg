<svg width="1000" height="180" viewBox="0 0 1000 180" fill="none"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="Hi, I'm Nguyễn Hoàng Nhân">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#11161d"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>

    <filter id="titleGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="rainFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b949e" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#8b949e" stop-opacity="0.26"/>
      <stop offset="0.72" stop-color="#8b949e" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#8b949e" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="reveal">
      <rect x="110" y="42" width="0" height="78">
        <animate attributeName="width"
                 values="0;780;780"
                 keyTimes="0;0.68;1"
                 dur="3.2s"
                 repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1000" height="180" rx="12" fill="url(#bg)"/>

  <!-- Subtle digital rain -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
     font-size="13"
     fill="url(#rainFade)"
     letter-spacing="2">

    <g transform="translate(28,-210)">
      <text y="0">0 1 7 2 9 4 1 6 0 3 8 5 1 0 7 4 2</text>
      <animateTransform attributeName="transform" type="translate"
                        values="28,-210;28,235"
                        dur="6.8s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(86,-165)">
      <text y="0">1 0 4 8 2 7 5 0 9 3 1 6 8 2 0 5 7</text>
      <animateTransform attributeName="transform" type="translate"
                        values="86,-165;86,235"
                        dur="5.6s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(145,-260)">
      <text y="0">3 1 0 6 2 9 7 4 0 8 5 1 3 0 6 2 9</text>
      <animateTransform attributeName="transform" type="translate"
                        values="145,-260;145,235"
                        dur="7.4s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(205,-195)">
      <text y="0">7 2 4 0 1 8 3 9 5 0 2 6 1 4 8 3 7</text>
      <animateTransform attributeName="transform" type="translate"
                        values="205,-195;205,235"
                        dur="6.1s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(270,-230)">
      <text y="0">9 0 3 5 1 7 2 6 4 8 0 1 9 3 5 2 7</text>
      <animateTransform attributeName="transform" type="translate"
                        values="270,-230;270,235"
                        dur="7.9s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(335,-150)">
      <text y="0">2 8 1 0 7 4 9 3 6 5 1 2 0 8 4 7 3</text>
      <animateTransform attributeName="transform" type="translate"
                        values="335,-150;335,235"
                        dur="5.9s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(405,-275)">
      <text y="0">5 1 9 3 0 6 8 2 7 4 1 0 5 9 2 6 3</text>
      <animateTransform attributeName="transform" type="translate"
                        values="405,-275;405,235"
                        dur="8.3s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(475,-180)">
      <text y="0">0 6 2 8 4 1 7 3 9 5 0 2 6 8 1 4 7</text>
      <animateTransform attributeName="transform" type="translate"
                        values="475,-180;475,235"
                        dur="6.5s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(545,-245)">
      <text y="0">8 3 1 7 0 5 2 9 4 6 1 8 0 3 7 5 2</text>
      <animateTransform attributeName="transform" type="translate"
                        values="545,-245;545,235"
                        dur="7.2s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(615,-160)">
      <text y="0">4 0 9 2 6 1 8 5 3 7 0 4 2 9 1 6 8</text>
      <animateTransform attributeName="transform" type="translate"
                        values="615,-160;615,235"
                        dur="5.4s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(685,-255)">
      <text y="0">1 5 0 8 3 7 2 4 9 6 1 0 5 3 8 2 7</text>
      <animateTransform attributeName="transform" type="translate"
                        values="685,-255;685,235"
                        dur="8s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(755,-205)">
      <text y="0">6 2 7 1 9 0 4 8 3 5 2 6 0 7 1 9 4</text>
      <animateTransform attributeName="transform" type="translate"
                        values="755,-205;755,235"
                        dur="6.3s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(825,-270)">
      <text y="0">3 9 0 5 2 8 1 6 4 7 0 3 9 2 5 8 1</text>
      <animateTransform attributeName="transform" type="translate"
                        values="825,-270;825,235"
                        dur="7.6s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(895,-175)">
      <text y="0">7 1 4 9 0 6 3 8 2 5 1 7 0 4 9 3 6</text>
      <animateTransform attributeName="transform" type="translate"
                        values="895,-175;895,235"
                        dur="5.8s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(955,-225)">
      <text y="0">2 0 8 5 1 7 4 9 3 6 0 2 8 1 5 7 4</text>
      <animateTransform attributeName="transform" type="translate"
                        values="955,-225;955,235"
                        dur="7.1s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Dark overlay keeps the title readable -->
  <rect x="120" y="38" width="760" height="92" rx="16" fill="#0d1117" opacity="0.62"/>

  <!-- Main title -->
  <g clip-path="url(#reveal)">
    <text x="500" y="100"
          text-anchor="middle"
          fill="#F0F6FC"
          font-size="41"
          font-weight="700"
          letter-spacing="1"
          font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"
          filter="url(#titleGlow)">Hi, I'm Nguyễn Hoàng Nhân</text>
  </g>

  <!-- Cursor -->
  <rect x="852" y="62" width="3.5" height="47" rx="1.75" fill="#F0F6FC">
    <animate attributeName="opacity"
             values="1;1;0;0;1"
             dur="1s"
             repeatCount="indefinite"/>
  </rect>

  <!-- Scan line -->
  <rect x="0" y="-3" width="1000" height="1.5" fill="#C9D1D9" opacity="0.10">
    <animate attributeName="y"
             from="-3"
             to="183"
             dur="5s"
             repeatCount="indefinite"/>
  </rect>

</svg>
