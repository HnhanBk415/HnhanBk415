<svg width="1000" height="210" viewBox="0 0 1000 210" fill="none"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Computer Science">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#30363d" stroke-width="0.45" opacity="0.45"/>
    </pattern>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="textReveal">
      <rect x="188" y="70" width="0" height="72">
        <animate attributeName="width"
                 values="0;625;625"
                 keyTimes="0;0.72;1"
                 dur="3.4s"
                 repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="210" rx="14" fill="url(#fade)"/>
  <rect width="1000" height="210" rx="14" fill="url(#grid)" opacity="0.38"/>

  <g opacity="0.55">
    <path d="M0 32H1000M0 178H1000" stroke="#30363d" stroke-width="1"/>
    <path d="M52 0V210M948 0V210" stroke="#21262d" stroke-width="1"/>
  </g>

  <g clip-path="url(#textReveal)">
    <text x="500" y="127"
          text-anchor="middle"
          fill="#F0F6FC"
          font-size="52"
          font-weight="700"
          letter-spacing="7"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          filter="url(#glow)">COMPUTER SCIENCE</text>
  </g>

  <rect x="812" y="82" width="4" height="54" rx="2" fill="#F0F6FC">
    <animate attributeName="opacity"
             values="1;1;0;0;1"
             dur="1s"
             repeatCount="indefinite"/>
  </rect>

  <rect x="0" y="-10" width="1000" height="2" fill="#8B949E" opacity="0.16">
    <animate attributeName="y"
             from="-10"
             to="220"
             dur="4.8s"
             repeatCount="indefinite"/>
  </rect>
</svg>
