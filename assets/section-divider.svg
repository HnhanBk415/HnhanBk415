<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 70" width="100%" height="70">
  <defs>
    <style>
      text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        user-select: none;
      }

      @keyframes rain-fall {
        0%   { transform: translateY(-90px); }
        100% { transform: translateY(85px); }
      }

      .c0 { animation: rain-fall 2.8s linear infinite 0s; }
      .c1 { animation: rain-fall 3.4s linear infinite -0.8s; }
      .c2 { animation: rain-fall 4s linear infinite -1.6s; }
      .c3 { animation: rain-fall 3.1s linear infinite -1.1s; }
      .c4 { animation: rain-fall 3.7s linear infinite -2s; }
      .c5 { animation: rain-fall 2.9s linear infinite -0.6s; }
      .c6 { animation: rain-fall 4.2s linear infinite -1.8s; }
      .c7 { animation: rain-fall 3.3s linear infinite -1.3s; }
      .c8 { animation: rain-fall 3.9s linear infinite -2.2s; }
      .c9 { animation: rain-fall 3s linear infinite -0.9s; }
      .c10 { animation: rain-fall 4.1s linear infinite -1.5s; }
      .c11 { animation: rain-fall 3.5s linear infinite -2.1s; }
      .c12 { animation: rain-fall 2.7s linear infinite -1.2s; }
      .c13 { animation: rain-fall 3.8s linear infinite -1.9s; }
      .c14 { animation: rain-fall 3.2s linear infinite -0.7s; }
      .c15 { animation: rain-fall 4.3s linear infinite -2.4s; }
      .c16 { animation: rain-fall 3.6s linear infinite -1.4s; }
      .c17 { animation: rain-fall 2.95s linear infinite -1.7s; }

      .glyph {
        fill: #ffffff;
        opacity: 0.14;
        font-size: 12px;
      }
    </style>
  </defs>

  <!-- nền trong suốt, chỉ có mưa ký tự lưa thưa -->
  <g>
    <g class="c0">
      <text class="glyph" x="18" y="8">4</text>
      <text class="glyph" x="18" y="28">V</text>
    </g>

    <g class="c1">
      <text class="glyph" x="120" y="10">2</text>
      <text class="glyph" x="120" y="30">8</text>
    </g>

    <g class="c2">
      <text class="glyph" x="184" y="6">Z</text>
      <text class="glyph" x="184" y="26">I</text>
    </g>

    <g class="c3">
      <text class="glyph" x="244" y="12">L</text>
      <text class="glyph" x="244" y="32">O</text>
    </g>

    <g class="c4">
      <text class="glyph" x="300" y="8">X</text>
      <text class="glyph" x="300" y="28">-</text>
    </g>

