    </g>

    <g class="c6">
      <text class="glyph" x="470" y="6">M</text>
      <text class="glyph" x="470" y="26">R</text>
    </g>

    <g class="c7">
      <text class="glyph" x="548" y="10">V</text>
      <text class="glyph" x="548" y="30">-</text>
    </g>

    <g class="c8">
      <text class="glyph" x="610" y="7">M</text>
      <text class="glyph" x="610" y="27">I</text>
    </g>

    <g class="c9">
