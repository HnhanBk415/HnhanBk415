    </g>

    <g class="c14">
      <text class="glyph" x="54" y="18">$</text>
      <text class="glyph" x="54" y="38">.</text>
    </g>

    <g class="c15">
      <text class="glyph" x="520" y="16">W</text>
      <text class="glyph" x="520" y="36">-</text>
    </g>

    <g class="c16">
