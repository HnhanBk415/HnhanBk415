<svg width="1000" height="28" viewBox="0 0 1000 28" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30363d" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#30363d" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#8b949e" stop-opacity="1"/>
      <stop offset="0.82" stop-color="#30363d" stop-opacity="1"/>
      <stop offset="1" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line x1="0" y1="14" x2="1000" y2="14" stroke="url(#lineFade)" stroke-width="1"/>

  <g transform="translate(500 14)">
    <circle r="2.2" fill="#8b949e">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="460" cy="14" r="1.2" fill="#6e7681" opacity="0.5"/>
  <circle cx="540" cy="14" r="1.2" fill="#6e7681" opacity="0.5"/>

  <rect x="-40" y="13" width="80" height="2" fill="#c9d1d9" opacity="0.22">
    <animateTransform attributeName="transform" type="translate" from="-40 0" to="1040 0" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>